<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NiliCAD v3.0.0 — 3D Sketch</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;color:#1d2733;background:#f3f5f7;overflow:hidden}button,input,select{font:inherit}button{border:1px solid #d5dce5;background:#fff;color:#253342;border-radius:11px;padding:10px;cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}button.active{background:#2378d4;color:white;border-color:#2378d4}button:focus-visible{outline:3px solid #5aa4ef}#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;background:#fffef9e8;border:1px solid #d9e0e8;border-radius:16px;padding:7px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 16px #14283b12;white-space:nowrap}#top strong{font-size:16px}#top small{font-size:10px;color:#607389}
#left{position:absolute;top:16px;left:12px;bottom:14px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:9px;pointer-events:none}#left>*{pointer-events:auto}.toolgroup{display:flex;flex-direction:column;gap:5px;background:#ffffffed;border:1px solid #e1e6eb;border-radius:15px;padding:6px;box-shadow:0 3px 14px #19334d14}.tool{display:flex;align-items:center;gap:10px;min-width:170px;text-align:left;direction:ltr;border:0;background:transparent;padding:8px 10px}.tool .sym{font-size:21px;width:27px;text-align:center}.tool span:last-child{font-size:13px}.tool.active{background:#2378d4;color:white}.tool[disabled]{opacity:.4}.toolgroup h4{font-size:11px;color:#7a8997;margin:5px 9px;text-align:left;direction:ltr}#right{position:absolute;top:15px;right:12px;z-index:5;display:flex;flex-direction:column;gap:7px}#right button{min-width:60px;box-shadow:0 2px 10px #19334d12}#bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:7;background:#ffffffef;border:1px solid #d6dfe9;border-radius:16px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 22px #1c344c24;max-width:calc(100% - 30px)}#bottom input{width:86px;border:1px solid #c8d3df;border-radius:8px;padding:9px;text-align:center}#bottom label{font-size:12px;white-space:nowrap}#bottom button{white-space:nowrap}
#hint{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:4;max-width:calc(100% - 240px);text-align:center;background:#ffffffd9;border-radius:10px;padding:8px 13px;font-size:12px;color:#4a647b;pointer-events:none}#message{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:10;display:none;background:#173e5b;color:white;padding:10px 16px;border-radius:12px;font-size:12px}#message.show{display:block}
#tree{position:absolute;top:70px;right:12px;width:190px;max-height:35vh;overflow:auto;z-index:5;background:#ffffffde;border:1px solid #dce3eb;border-radius:13px;padding:9px;font-size:12px}#tree b{display:block;margin-bottom:6px}#tree div{padding:7px;border-radius:6px;cursor:pointer}#tree div:hover{background:#e7f0ff}
#pull{position:absolute;z-index:9;display:none;touch-action:none;cursor:ns-resize;border:2px solid #b87807;background:#ffd34c;color:#583700;border-radius:100px;width:54px;height:54px;font-size:24px;box-shadow:0 3px 12px #4b390855}#pull.show{display:block}#dim{position:absolute;z-index:8;display:none;background:#fff;border:1px solid #2378d4;border-radius:8px;padding:7px;color:#1e5e9c;font-weight:600;font-size:13px;pointer-events:none}
@media(max-width:700px){#left{left:5px;top:65px;bottom:65px;overflow:auto}.tool{min-width:52px;padding:7px;justify-content:center}.tool span:last-child,.toolgroup h4{display:none}.toolgroup{padding:4px}#tree{top:65px;width:130px;max-height:24vh}#hint{top:70px;left:60px;right:145px;transform:none;max-width:none;font-size:10px}#bottom{bottom:5px;gap:4px;padding:5px}#bottom button{padding:8px;font-size:11px}#bottom input{width:62px}#right{right:5px}#right button{padding:8px;font-size:11px;min-width:40px}#top{top:6px;padding:5px 9px}#top small{display:none}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body>
<canvas id="scene"></canvas>
<div id="top"><strong>⬡ NiliCAD</strong><span>Untitled Project</span><small>v3.0.0 · 3D Sketch</small><button id="save">ذخیره</button><button id="load">بازکردن</button><input id="file" type="file" accept=".json,application/json" hidden></div>
<div id="left"><div class="toolgroup" id="mainTools"><h4>WORKSPACE</h4><button class="tool" data-main="sketch"><span class="sym">✎</span><span>Sketch</span></button><button class="tool" data-main="items"><span class="sym">▱</span><span>Items</span></button><button class="tool" data-main="construct" disabled title="در مرحله بعد فعال می‌شود"><span class="sym">⬡</span><span>Construct</span></button><button class="tool" data-main="transform" disabled><span class="sym">✥</span><span>Transform</span></button><button class="tool" data-main="tools" disabled><span class="sym">⚒</span><span>Tools</span></button><button class="tool" data-main="visualize" disabled><span class="sym">◉</span><span>Visualize</span></button></div>
<div class="toolgroup" id="skTools" style="display:none"><h4>SKETCH · 3D PLANE</h4><button class="tool" data-tool="line"><span class="sym">╱</span><span>Line</span></button><button class="tool" data-tool="arc"><span class="sym">⌒</span><span>Arc · 3 points</span></button><button class="tool" data-tool="circle"><span class="sym">◉</span><span>Circle</span></button><button class="tool" data-tool="rectangle"><span class="sym">▭</span><span>Rectangle</span></button><button class="tool" id="closeLoop"><span class="sym">▣</span><span>Close Profile</span></button><button class="tool" id="undoPoint"><span class="sym">↶</span><span>Undo Point</span></button><button class="tool" id="exitSketch"><span class="sym">×</span><span>Exit Sketch</span></button></div></div>
<div id="right"><button id="viewIso">ISO</button><button id="viewTop">TOP</button><button id="viewFront">FRONT</button><button id="planeBtn">XY / XZ / YZ</button><button id="newProject">جدید</button></div>
<div id="tree"><b>Items / Sketches</b><div id="treeList">هنوز مدلی ایجاد نشده است</div></div>
<div id="hint">برای شروع Sketch را انتخاب کن؛ روی صفحه سه‌بعدی نقطه‌گذاری کن و سپس سطح را Extrude کن.</div>
<div id="bottom"><label>Plane <select id="plane"><option>XZ</option><option>XY</option><option>YZ</option></select></label><label>Depth (mm) <input id="depth" type="number" value="20" step="1"></label><button id="finish" disabled>انتخاب سطح / Extrude</button><button id="create" class="active" disabled>ساخت حجم</button></div>
<button id="pull" title="دستگیره کششی Extrude">↥</button><div id="dim"></div><div id="message"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.getElementById('scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf4f6f8);renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,10000);
camera.position.set(125,120,155);const orbit=new OrbitControls(camera,canvas);orbit.target.set(0,0,0);orbit.enableDamping=true;orbit.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
scene.add(new THREE.HemisphereLight(0xffffff,0x9aaec0,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(100,170,130);scene.add(light);
const grid=new THREE.GridHelper(600,60,0xb7c4d0,0xe0e6eb);scene.add(grid);const axes=new THREE.AxesHelper(65);scene.add(axes);
const sketchGroup=new THREE.Group();scene.add(sketchGroup);const solidGroup=new THREE.Group();scene.add(solidGroup);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),workPlane=new THREE.Plane(),normal=new THREE.Vector3(0,1,0);
const $=id=>document.getElementById(id);let active=false,tool='line',points=[],segments=[],circle=null,arcPending=[],rectStart=null,closed=false,pullMode=false,objects=[],nextId=1,pullDrag=null,selectedId=null;
const mat=new THREE.MeshStandardMaterial({color:0x61a9ba,metalness:.1,roughness:.6,side:THREE.DoubleSide});
const previewMat=new THREE.MeshStandardMaterial({color:0x4d9be5,transparent:true,opacity:.32,side:THREE.DoubleSide,depthWrite:false});
let preview=null,facePreview=null;
function notify(s){$('message').textContent=s;$('message').classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>$('message').classList.remove('show'),2300)}
function planeName(){return $('plane').value}
function setPlane(){normal.set(0,planeName()==='XZ'?1:0,0);if(planeName()==='XY')normal.set(0,0,1);if(planeName()==='YZ')normal.set(1,0,0);workPlane.setFromNormalAndCoplanarPoint(normal,new THREE.Vector3(0,0,0));drawSketch()}
function to3(p){if(planeName()==='XZ')return new THREE.Vector3(p.x,0,p.y);if(planeName()==='XY')return new THREE.Vector3(p.x,p.y,0);return new THREE.Vector3(0,p.x,p.y)}
function from3(p){return planeName()==='XZ'?{x:p.x,y:p.z}:planeName()==='XY'?{x:p.x,y:p.y}:{x:p.y,y:p.z}}
function hit(e){const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const p=ray.ray.intersectPlane(workPlane,new THREE.Vector3());if(!p)return null;const q=from3(p);return{x:Math.round(q.x*10)/10,y:Math.round(q.y*10)/10}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function arcData(a,m,b){const u=m.x-a.x,v=m.y-a.y,x=b.x-a.x,y=b.y-a.y,d=2*(u*y-v*x);if(Math.abs(d)<1e-7)return null;const U=u*u+v*v,V=x*x+y*y,cx=a.x+(U*y-V*v)/d,cy=a.y+(u*V-x*U)/d,r=Math.hypot(a.x-cx,a.y-cy);const t0=Math.atan2(a.y-cy,a.x-cx),tm=Math.atan2(m.y-cy,m.x-cx),t1=Math.atan2(b.y-cy,b.x-cx),norm=t=>(t%(2*Math.PI)+2*Math.PI)%(2*Math.PI),ccw=norm(tm-t0)<=norm(t1-t0);return{cx,cy,r,t0,span:ccw?norm(t1-t0):-norm(t0-t1)}}
function shapeFrom(){const s=new THREE.Shape();if(circle){s.absarc(circle.center.x,circle.center.y,circle.r,0,Math.PI*2,false);return s}if(!closed||!segments.length)return null;s.moveTo(segments[0].a.x,segments[0].a.y);for(const seg of segments){if(seg.kind==='line')s.lineTo(seg.b.x,seg.b.y);else{const a=arcData(seg.a,seg.m,seg.b);if(!a)return null;for(let i=1;i<=48;i++){const t=a.t0+a.span*i/48;s.lineTo(a.cx+a.r*Math.cos(t),a.cy+a.r*Math.sin(t))}}}s.closePath();return s}
function line(a,b,color=0x1679d6){const pts=[to3(a),to3(b)];const g=new THREE.BufferGeometry().setFromPoints(pts);const o=new THREE.Line(g,new THREE.LineBasicMaterial({color,depthTest:false}));o.renderOrder=5;sketchGroup.add(o)}
function path(arr,color=0x1679d6){const g=new THREE.BufferGeometry().setFromPoints(arr.map(to3));const o=new THREE.Line(g,new THREE.LineBasicMaterial({color,depthTest:false}));o.renderOrder=5;sketchGroup.add(o)}
function drawSketch(){while(sketchGroup.children.length){const o=sketchGroup.children[0];sketchGroup.remove(o);o.geometry?.dispose();o.material?.dispose()}for(const seg of segments){if(seg.kind==='line')line(seg.a,seg.b);else{const a=arcData(seg.a,seg.m,seg.b);if(a)path(Array.from({length:65},(_,i)=>({x:a.cx+a.r*Math.cos(a.t0+a.span*i/64),y:a.cy+a.r*Math.sin(a.t0+a.span*i/64)})))}}if(circle)path(Array.from({length:129},(_,i)=>({x:circle.center.x+circle.r*Math.cos(i*Math.PI/64),y:circle.center.y+circle.r*Math.sin(i*Math.PI/64)})));for(const p of points){const o=new THREE.Mesh(new THREE.SphereGeometry(1.15,10,8),new THREE.MeshBasicMaterial({color:0xe7a729,depthTest:false}));o.position.copy(to3(p));o.renderOrder=6;sketchGroup.add(o)}if(preview){scene.remove(preview);preview.geometry.dispose();preview=null}const s=shapeFrom();if(s){const g=new THREE.ShapeGeometry(s,32);orient(g);preview=new THREE.Mesh(g,previewMat);scene.add(preview)}$('finish').disabled=!s;$('create').disabled=!s||!pullMode;updateArrow()}
function orient(g){if(planeName()==='XZ')g.rotateX(Math.PI/2);if(planeName()==='YZ')g.rotateY(Math.PI/2)}
function resetSketch(){points=[];segments=[];circle=null;arcPending=[];rectStart=null;closed=false;pullMode=false;$('pull').classList.remove('show');drawSketch()}
function setTool(t){tool=t;arcPending=[];rectStart=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('hint').textContent=({line:'Line: نقطه‌های متوالی را روی صفحه سه‌بعدی لمس کن.',arc:'Arc: سه نقطه شروع، میانی و پایان را لمس کن.',circle:'Circle: ابتدا مرکز و سپس نقطه محیط را لمس کن.',rectangle:'Rectangle: دو گوشه مخالف را لمس کن.'})[t]}
function closeProfile(){if(circle){closed=true;drawSketch();return}if(points.length<3){notify('حداقل سه رأس برای سطح بسته لازم است');return}const a=points.at(-1),b=points[0];if(distance(a,b)>.01)segments.push({kind:'line',a,b});closed=true;drawSketch();notify('سطح بسته شد؛ روی Extrude بزن')}
function addPoint(p){if(pullMode||closed){notify('برای Sketch جدید، از Sketch خارج و دوباره وارد شو');return}if(tool==='line'){if(points.length){const a=points.at(-1);if(points.length>=3&&distance(p,points[0])<3){closeProfile();return}if(distance(a,p)>.1)segments.push({kind:'line',a,b:p})}points.push(p)}else if(tool==='circle'){if(!arcPending.length){resetSketch();arcPending=[p]}else{const r=distance(arcPending[0],p);if(r>.1){circle={center:arcPending[0],r};arcPending=[];closed=true}}}else if(tool==='rectangle'){if(!rectStart)rectStart=p;else{const a=rectStart,b=p;if(Math.abs(a.x-b.x)<.1||Math.abs(a.y-b.y)<.1)return;const v=[a,{x:b.x,y:a.y},b,{x:a.x,y:b.y}];points=v;segments=v.map((q,i)=>({kind:'line',a:q,b:v[(i+1)%4]}));closed=true;rectStart=null}}else if(tool==='arc'){arcPending.push(p);if(arcPending.length===3){const [a,m,b]=arcPending;if(arcData(a,m,b)){if(points.length&&distance(points.at(-1),a)>.01)segments.push({kind:'line',a:points.at(-1),b:a});if(!points.length)points.push(a);segments.push({kind:'arc',a,m,b});points.push(b)}else notify('سه نقطه نباید روی یک خط باشند');arcPending=[]}}drawSketch()}
function makeGeometry(shape,depth,plane){const g=new THREE.ExtrudeGeometry(shape,{depth,steps:1,bevelEnabled:false,curveSegments:64});if(plane==='XZ')g.rotateX(Math.PI/2);if(plane==='YZ')g.rotateY(Math.PI/2);g.computeVertexNormals();return g}
function build(){const s=shapeFrom(),depth=Number($('depth').value);if(!s||!Number.isFinite(depth)||Math.abs(depth)<.1||Math.abs(depth)>10000){notify('سطح بسته و عمق معتبر لازم است');return}const profile={segments:JSON.parse(JSON.stringify(segments)),circle:circle?JSON.parse(JSON.stringify(circle)):null};const o={id:nextId++,name:'Extrude '+nextId,plane:planeName(),profile,depth};objects.push(o);addSolid(o);refreshTree();resetSketch();active=false;$('skTools').style.display='none';$('mainTools').style.display='flex';$('hint').textContent='حجم ایجاد شد. برای ترسیم بعدی Sketch را انتخاب کن.';notify('حجم سه‌بعدی ایجاد شد و در پروژه ذخیره می‌شود')}
function addSolid(o){const oldPlane=$('plane').value;$('plane').value=o.plane;const oldSeg=segments,oldCircle=circle,oldClosed=closed;segments=o.profile.segments;circle=o.profile.circle;closed=true;const s=shapeFrom();segments=oldSeg;circle=oldCircle;closed=oldClosed;$('plane').value=oldPlane;if(!s)return;const mesh=new THREE.Mesh(makeGeometry(s,o.depth,o.plane),mat.clone());mesh.userData.id=o.id;solidGroup.add(mesh)}
function refreshTree(){$('treeList').replaceChildren();if(!objects.length){$('treeList').textContent='هنوز مدلی ایجاد نشده است';return}for(const o of objects){const d=document.createElement('div');d.textContent='▣ '+o.name+' · '+o.plane+' · '+o.depth+' mm';d.onclick=()=>{selectedId=o.id;notify('انتخاب: '+o.name)};$('treeList').append(d)}}
function updateArrow(){const btn=$('pull');if(!pullMode||!shapeFrom()){btn.classList.remove('show');return}const s=shapeFrom();const pts=s.getPoints(32),cx=pts.reduce((v,p)=>v+p.x,0)/pts.length,cy=pts.reduce((v,p)=>v+p.y,0)/pts.length;const q=to3({x:cx,y:cy}).addScaledVector(normal,Number($('depth').value)||20);q.project(camera);btn.style.left=((q.x+1)/2*innerWidth-27)+'px';btn.style.top=((-q.y+1)/2*innerHeight-27)+'px';btn.classList.add('show')}
function sketchMode(){active=true;resetSketch();$('mainTools').style.display='none';$('skTools').style.display='flex';setTool('line');$('hint').textContent='Sketch در همان نمای سه‌بعدی انجام می‌شود؛ صفحه XZ انتخاب شده است.'}
canvas.addEventListener('pointerdown',e=>{if(!active||pullMode||e.button>0)return;canvas.dataset.sx=e.clientX;canvas.dataset.sy=e.clientY;canvas.dataset.st=Date.now()});
canvas.addEventListener('pointerup',e=>{if(!active||pullMode||!canvas.dataset.st)return;const dx=e.clientX-Number(canvas.dataset.sx),dy=e.clientY-Number(canvas.dataset.sy),dt=Date.now()-Number(canvas.dataset.st);delete canvas.dataset.st;if(Math.hypot(dx,dy)>9||dt>450)return;const p=hit(e);if(p)addPoint(p)});
$('pull').addEventListener('pointerdown',e=>{pullDrag={y:e.clientY,depth:Number($('depth').value)||20,id:e.pointerId};$('pull').setPointerCapture(e.pointerId);e.preventDefault()});
$('pull').addEventListener('pointermove',e=>{if(!pullDrag||pullDrag.id!==e.pointerId)return;$('depth').value=(Math.round((pullDrag.depth+(pullDrag.y-e.clientY)*.35)*10)/10).toString();updateArrow();e.preventDefault()});
$('pull').addEventListener('pointerup',()=>pullDrag=null);
$('depth').oninput=updateArrow;$('plane').onchange=()=>{if(segments.length||circle){notify('برای تغییر صفحه، Sketch را ابتدا پاک کن');return}setPlane()};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('closeLoop').onclick=closeProfile;$('undoPoint').onclick=()=>{if(closed||circle){resetSketch();return}segments.pop();points.pop();arcPending=[];drawSketch()};$('exitSketch').onclick=()=>{active=false;resetSketch();$('skTools').style.display='none';$('mainTools').style.display='flex'};
document.querySelector('[data-main="sketch"]').onclick=sketchMode;
document.querySelector('[data-main="items"]').onclick=()=>$('tree').hidden=!$('tree').hidden;
$('finish').onclick=()=>{if(!shapeFrom())return;pullMode=true;$('create').disabled=false;updateArrow();notify('فلش زرد را بکش یا عمق را وارد کن، سپس ساخت حجم را بزن')};$('create').onclick=build;
$('viewIso').onclick=()=>{camera.position.set(125,120,155);orbit.target.set(0,0,0)};$('viewTop').onclick=()=>{camera.position.set(0,220,.01);orbit.target.set(0,0,0)};$('viewFront').onclick=()=>{camera.position.set(0,0,220);orbit.target.set(0,0,0)};
$('planeBtn').onclick=()=>{$('plane').selectedIndex=($('plane').selectedIndex+1)%3;setPlane()};
$('newProject').onclick=()=>{if(!confirm('پروژه جدید؟'))return;objects=[];nextId=1;while(solidGroup.children.length){const m=solidGroup.children[0];solidGroup.remove(m);m.geometry.dispose()}resetSketch();refreshTree()};
$('save').onclick=()=>{const data={format:'NiliCAD-3D-Sketch',version:3,units:'mm',objects};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='project.nilicad.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$('load').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.format!=='NiliCAD-3D-Sketch'||!Array.isArray(d.objects))throw Error('فرمت فایل متعلق به این نسخه نیست');const valid=d.objects.every(o=>['XZ','XY','YZ'].includes(o.plane)&&o.profile&&Array.isArray(o.profile.segments)&&Number.isFinite(o.depth));if(!valid)throw Error('ساختار پروژه نامعتبر است');while(solidGroup.children.length){const m=solidGroup.children[0];solidGroup.remove(m);m.geometry.dispose()}objects=d.objects;nextId=Math.max(1,...objects.map(o=>o.id+1));for(const o of objects)addSolid(o);resetSketch();refreshTree();notify('پروژه با موفقیت باز شد')}catch(err){alert('خطا در بازکردن پروژه: '+err.message)}e.target.value=''};
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();updateArrow()});
setPlane();function loop(){requestAnimationFrame(loop);orbit.update();updateArrow();renderer.render(scene,camera)}loop();
</script></body></html>

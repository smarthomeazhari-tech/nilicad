name: Build optional browser IGES converter
on:
  push:
    paths:
      - browser-engine/iges/converter.cpp
      - browser-engine/iges/custom-build.yml
      - browser-engine/iges/build.py
      - .github/workflows/iges-build.yml
  workflow_dispatch:
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal exact converter from pinned OCCT image
        run: python3 browser-engine/iges/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-iges-converter
          path: browser-engine/iges/generated/
          if-no-files-found: error

name: Browser-only exact CAD
on: [push, pull_request]
jobs:
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify WebAssembly geometry and browser workflows without a backend
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-only-cad-screenshots
          path: test-results/
